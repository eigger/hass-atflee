name: Tests
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@ff46b0c8d9ba53b1d35ab9a4aa38f4db26c06870 # reviewed standards commit
    with:
      domain: atflee
      python-versions: '["3.14"]'
      lint-python-version: '3.14'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      test-profile: ha
      ha-components: 'bluetooth recorder sensor binary_sensor select switch'
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["blesession"]'
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@ff46b0c8d9ba53b1d35ab9a4aa38f4db26c06870 # reviewed standards commit
    with:
      domain: atflee
      python-versions: '["3.13"]'
      lint-python-version: '3.14'
      requirements: requirements_test_min.txt
      expected-ha-version: '2025.8.0'
      test-profile: ha
      ha-components: 'bluetooth recorder sensor binary_sensor select switch'
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["blesession"]'
