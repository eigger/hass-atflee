name: Tests
'on':
  push:
    branches:
    - master
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.1.3 # reviewed standards commit
    with:
      domain: atflee
      python-versions: '["3.14"]'
      lint-python-version: '3.14'
      requirements: requirements_test.txt
      test-profile: ha
      ha-components: 'bluetooth recorder sensor binary_sensor select switch'
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["blesession"]'
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@v1.1.3 # reviewed standards commit
    with:
      domain: atflee
      python-versions: '["3.13"]'
      lint-python-version: '3.14'
      requirements: requirements_test_min.txt
      expected-ha-version: '2025.8.0'
      test-profile: ha
      ha-components: 'bluetooth recorder sensor binary_sensor select switch'
      dependency-modes: '["current", "minimum"]'
      minimum-packages: '["blesession"]'
