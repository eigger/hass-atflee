version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: daily
  cooldown:
    exclude:
    - eigger/hass-repo-standards
    - eigger/hass-repo-standards/*
  groups:
    central-standards:
      patterns:
      - eigger/hass-repo-standards
      - eigger/hass-repo-standards/*
- package-ecosystem: pip
  directory: /
  exclude-paths:
  - requirements_test_min.txt
  - constraints/**
  schedule:
    interval: weekly
  groups:
    home-assistant-tests:
      patterns:
      - homeassistant
      - pytest-homeassistant-custom-component
